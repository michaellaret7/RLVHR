[project]
name = "rlvr"
version = "0.1.0"
description = "Fine-tuning LLMs with REINFORCE / RLVR, from scratch in PyTorch (notes after Janu Verma's article)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "numpy>=1.26",
    "tqdm>=4.66",
    "accelerate>=1.13.0",
    "vllm>=0.22 ; sys_platform == 'linux'",
    "boto3>=1.43.27",
    "python-dotenv>=1.0",
]

# This is a flat research repo, not an installable package.
# Run scripts directly from the repo root, e.g.:
#   uv run python evaluation.py
#   uv run python algorithms/reinforce.py

# On Windows the default PyPI torch wheel is CPU-only, so pull torch from
# PyTorch's CUDA 12.8 index there. On Linux the PyPI wheel is CUDA-enabled
# (cu130) and is the exact build vLLM pins against, so use PyPI directly.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[tool.pyright]
typeCheckingMode = "off"
